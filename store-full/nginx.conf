server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # API
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /sitemap.xml { proxy_pass http://api:3000/api/sitemap.xml; }
  location /share/ { proxy_pass http://api:3000/api/share/; proxy_set_header Host $host; }

  # خدمة الرفع (QR + ملفات) — للقراءة فقط من المتجر
  location /upload/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://upload:4000/;
    proxy_set_header Host $host;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location ~* \.(css|js|svg|png|jpg|webp|woff2)$ { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
