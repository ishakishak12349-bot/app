name: abdo-sit

services:
  # المتجر الافتراضي: يقرأ التطبيقات من API البوت (يُضبط في store/config.js)
  store:
    build: ./store
    restart: unless-stopped
    ports:
      - "8080:80"

  db:
    profiles: ["full"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build: ./api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_STORE_URL: ${PUBLIC_STORE_URL}
      PUBLIC_API_URL: ${PUBLIC_STORE_URL}
    expose: ["3000"]

  upload:
    profiles: ["full"]
    build: ./upload-service
    restart: unless-stopped
    environment:
      UPLOAD_API_KEY: ${UPLOAD_API_KEY}
      MAX_FILE_SIZE_GB: ${MAX_FILE_SIZE_GB:-2}
      PUBLIC_UPLOAD_URL: ${PUBLIC_UPLOAD_URL}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
    volumes:
      - uploads:/data
    ports:
      - "4000:4000"          # روابط التحميل المباشرة (ضع CDN أمامه عند النشر)

  store-full:
    build: ./store-full
    profiles: ["full"]
    restart: unless-stopped
    depends_on: [api, upload]
    ports:
      - "8082:80"

  admin:
    profiles: ["full"]
    build: ./admin
    restart: unless-stopped
    depends_on: [api, upload]
    ports:
      - "8081:80"            # الأفضل حجبه خلف VPN/عنوان IP موثوق أو Cloudflare Access

volumes:
  dbdata:
  uploads:
